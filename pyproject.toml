[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iddo-harness"
version = "1.0.0"
description = "Iddo Harness agent — hands & eyes on your machine for Perplexity Computer (and other AMP bricks)."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=7", "respx>=0.20", "pytest-asyncio>=0.23"]
# v2 Agent Fabric: watch_* prefers watchdog, process_* prefers psutil. Both
# degrade to built-in fallbacks (mtime polling / ps+tasklist) when absent.
agentfabric = ["watchdog>=4.0.0", "psutil>=5.9.0"]
# v3 Track B: result signing and the secrets vault. Strongly recommended — the
# harness runs without it, but every result it publishes is then unforgeable by
# nobody, and {{secret:...}} references cannot be resolved.
security = ["cryptography>=42.0.0"]

[project.scripts]
iddo-harness = "agent.cli:cli"

[tool.setuptools]
packages = ["agent"]
