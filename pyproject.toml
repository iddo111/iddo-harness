[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iddo-harness"
version = "1.0.0"
description = "Iddo Harness agent — hands & eyes on your machine for Perplexity Computer (and other AMP bricks)."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=7", "respx>=0.20", "pytest-asyncio>=0.23"]

[project.scripts]
iddo-harness = "agent.cli:cli"

[tool.setuptools]
packages = ["agent"]
