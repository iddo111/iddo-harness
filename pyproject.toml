[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iddo-harness"
version = "1.0.0"
description = "Iddo Harness agent — hands & eyes on your machine for Perplexity Computer (and other AMP bricks)."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=7", "respx>=0.20", "pytest-asyncio>=0.23"]
# v2 Agent Fabric: watch_* prefers watchdog, process_* prefers psutil. Both
# degrade to built-in fallbacks (mtime polling / ps+tasklist) when absent.
agentfabric = ["watchdog>=4.0.0", "psutil>=5.9.0"]
# v3 Agent-Native: schedule_task prefers croniter for cron expressions and
# degrades to a built-in 5-field parser when absent.
agentnative = ["croniter>=2.0.0"]

[project.scripts]
iddo-harness = "agent.cli:cli"

[tool.setuptools]
packages = ["agent"]
